mode: rule
ipv6: false
log-level: error
allow-lan: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090

dns:
  enable: true
  listen: 127.0.0.1:7874
  ipv6: false
  default-nameserver:
    - 8.8.8.8
    - 8.8.4.4
  nameserver:
    - "https://8.8.8.8/dns-query"

keep-alive-idle: 15
keep-alive-interval: 15

profile:
  store-selected: true
  tracing: false

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - '+.lan'
    - '+.local'
    - '+.push.apple.com'
    - '+.apple.com'
    - '+.msftconnecttest.com'
    - '+.3gppnetwork'

